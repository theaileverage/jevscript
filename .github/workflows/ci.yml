# Every check in AGENTS.md, on every push and pull request. The toolchain comes
# from rust-toolchain.toml and every other version is pinned in the repo, so a
# green run here means the same thing as a green run locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build
      - name: Zed extension (built as Zed builds it)
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2 --locked --manifest-path editors/zed/Cargo.toml
      - name: Keep the binary for the SDK tests
        uses: actions/upload-artifact@v4.6.2
        with:
          name: jevscript
          path: target/debug/jevscript
          retention-days: 1

  sdks:
    name: sdks, adapters and editors
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: jevscript
          path: target/debug
      - run: chmod +x target/debug/jevscript
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install tmux for the adapter's integration test
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: JavaScript SDK
        working-directory: sdk/js
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run typecheck
          pnpm run build
      - name: Python SDK
        run: python3 -m pip install pytest && python3 -m pytest sdk/python
      - name: Agent adapter suite
        working-directory: adapters
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run typecheck
          pnpm run build
      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run typecheck
          pnpm run package

  # The toolbox server runs its TypeScript directly, which needs Node 26; its
  # browser pass drives the runner's Chrome against fixture endpoints only.
  toolbox:
    name: toolbox (apps/toolbox)
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: jevscript
          path: target/debug
      - run: chmod +x target/debug/jevscript
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26
      - name: Install runtime verification tools
        run: sudo apt-get update && sudo apt-get install -y tmux bubblewrap libseccomp2 python3
      - name: SDK and agent adapters the toolbox links
        run: |
          (cd sdk/js && pnpm install --frozen-lockfile && pnpm run build)
          (cd adapters && pnpm install --frozen-lockfile && pnpm run build)
      - name: Toolbox
        working-directory: apps/toolbox
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run verify:python-sandbox
          pnpm test
          JEVS_BROWSER="$(command -v google-chrome)" pnpm test:browser

  # Lists and dry-runs every runbook cell without running one; see runbooks/README.md.
  runbooks:
    name: runbooks (Runme list and dry run)
    runs-on: ubuntu-24.04
    env:
      RUNME_VERSION: 3.17.5
      RUNME_SHA256: 14b22f01a20ba66d29c73230027f99f2d2821db48638f9328c010a448237e993
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install the pinned Runme CLI
        run: |
          curl -fsSLo "$RUNNER_TEMP/runme.tar.gz" "https://github.com/runmedev/runme/releases/download/v$RUNME_VERSION/runme_linux_x86_64.tar.gz"
          echo "$RUNME_SHA256  $RUNNER_TEMP/runme.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/runme"
          tar -xzf "$RUNNER_TEMP/runme.tar.gz" -C "$RUNNER_TEMP/runme" runme
          echo "$RUNNER_TEMP/runme" >> "$GITHUB_PATH"
      - run: python3 scripts/check_runbooks.py

  package-smoke:
    name: offline npm and PyPI artifact smoke (Linux x64)
    runs-on: ubuntu-24.04
    outputs:
      sums_sha256: ${{ steps.bundle.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Registry and release binary integration
        run: python3 -m unittest discover -s scripts -p 'test_*integration.py'
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - run: python3 scripts/build_release_cli.py --target linux-x64-gnu
      - run: python3 scripts/stage_release.py npm --binary-root .release-tmp/binaries --targets linux-x64-gnu
      - run: python3 scripts/stage_release.py wheel --binary-root .release-tmp/binaries --targets linux-x64-gnu
      - run: python3 -m pip install build==1.3.0 hatchling==1.28.0
      - name: Build Linux wheel
        working-directory: sdk/python
        env:
          JEVSCRIPT_TARGET: linux-x64-gnu
          JEVSCRIPT_PLATFORM_TAG: manylinux_2_39_x86_64
          JEVSCRIPT_WHEEL_TAG: py3-none-manylinux_2_39_x86_64
        run: python3 -m build --wheel --no-isolation --outdir ../../.release-tmp/wheelhouse
      - name: Build npm tarball
        working-directory: sdk/js
        env:
          JEVSCRIPT_PACK_TARGETS: linux-x64-gnu
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          npm pack --pack-destination ../../.release-tmp
      - name: Verify and upload a representative bundle as release.yml does
        id: bundle
        uses: ./.github/actions/upload-package-bundle
        with:
          targets: linux-x64-gnu
      - run: python3 scripts/smoke_packages.py --npm .release-tmp/theaileverage-jevscript-0.1.3.tgz --wheel .release-tmp/wheelhouse/jevscript-0.1.3-py3-none-manylinux_2_39_x86_64.whl

  # release.yml's install matrix and publish.yml only ever see the bundle
  # through an artifact roundtrip, so prove that roundtrip before a tag exists.
  package-bundle-roundtrip:
    name: package bundle artifact roundtrip
    needs: package-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: package-bundle
          path: .release-tmp
      - name: Downloaded bundle matches the uploaded digests, versions and commit
        env:
          SUMS_SHA256: ${{ needs.package-smoke.outputs.sums_sha256 }}
        run: python3 scripts/verify_release_bundle.py .release-tmp --commit "$GITHUB_SHA" --targets linux-x64-gnu --sums-sha256 "$SUMS_SHA256"

  # The release workflow runs only on a tag, which can never move, so the
  # Windows build and its embedded-path scan must pass here first.
  windows-package-smoke:
    name: offline npm and PyPI artifact smoke (Windows x64)
    runs-on: windows-2022
    defaults:
      run:
        # PowerShell ignores a failing native command before a step's last line.
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - run: python scripts/build_release_cli.py --target win32-x64
      - run: python scripts/stage_release.py npm --binary-root .release-tmp/binaries --targets win32-x64
      - run: python scripts/stage_release.py wheel --binary-root .release-tmp/binaries --targets win32-x64
      - run: python -m pip install build==1.3.0 hatchling==1.28.0
      - name: Build Windows wheel
        working-directory: sdk/python
        env:
          JEVSCRIPT_TARGET: win32-x64
          JEVSCRIPT_PLATFORM_TAG: win_amd64
          JEVSCRIPT_WHEEL_TAG: py3-none-win_amd64
        run: python -m build --wheel --no-isolation --outdir ../../.release-tmp/wheelhouse
      - name: Build npm tarball
        working-directory: sdk/js
        env:
          JEVSCRIPT_PACK_TARGETS: win32-x64
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          npm pack --pack-destination ../../.release-tmp
      - run: python scripts/smoke_packages.py --npm .release-tmp/theaileverage-jevscript-0.1.3.tgz --wheel .release-tmp/wheelhouse/jevscript-0.1.3-py3-none-win_amd64.whl
