# Registry publication of the exact bytes a passing staging run built and tested.
# Dispatch it on the release tag with that run's ID and the reviewed SHA-256 of
# its SHA256SUMS. Nothing is rebuilt here. npm and PyPI trust this workflow file
# and its protected environments through OIDC after npm's first authenticated
# bootstrap. The one-time credential is a protected environment secret.
name: publish package release

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: ID of a successful "stage package release" run on this tag
        required: true
      sums_sha256:
        description: Reviewed SHA-256 of that run's SHA256SUMS
        required: true
      npm_bootstrap:
        description: First release only; publish with the protected short-lived npm credential
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Require a successful staging run of this tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.staging_run_id }}
          NPM_BOOTSTRAP: ${{ inputs.npm_bootstrap }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          if [ "$NPM_BOOTSTRAP" = true ]; then test "$version" = 0.1.2; fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .path <<<"$run")" = .github/workflows/release.yml
          test "$(jq -r .repository.full_name <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$GITHUB_SHA"
      - name: Require release tag on merged main
        run: python3 scripts/check_release_ref.py --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE"
      - uses: actions/download-artifact@v4.3.0
        with:
          name: package-bundle
          path: bundle
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Match reviewed digests, versions, source commit and CLI bytes
        env:
          SUMS_SHA256: ${{ inputs.sums_sha256 }}
        run: python3 scripts/verify_release_bundle.py bundle --commit "$GITHUB_SHA" --sums-sha256 "$SUMS_SHA256"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: verified-bundle
          path: bundle/

  npm-bootstrap:
    if: inputs.npm_bootstrap
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/jevscript
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: verified-bundle
          path: bundle
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0
      - name: Bootstrap npm from the exact reviewed bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_EXPECTED_OWNER: ${{ vars.NPM_EXPECTED_OWNER }}
        run: python3 scripts/publish_npm.py bundle --bootstrap

  pypi:
    if: always() && needs.verify.result == 'success' && (needs['npm-bootstrap'].result == 'success' || needs['npm-bootstrap'].result == 'skipped')
    needs: [verify, npm-bootstrap]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/jevscript/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: verified-bundle
          path: bundle
      - name: Compare existing PyPI wheels with verified bytes
        run: python3 scripts/check_pypi_wheels.py bundle
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: bundle/wheelhouse/
          # A rerun after npm failed must not stop on wheels PyPI already holds.
          skip-existing: true
      - name: Require exact verified wheels on PyPI
        run: python3 scripts/check_pypi_wheels.py bundle --require-all

  npm:
    needs: pypi
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/jevscript
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: verified-bundle
          path: bundle
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@11.19.0
      - name: Publish or verify the exact reviewed npm tarball
        env:
          NPM_BOOTSTRAP: ${{ inputs.npm_bootstrap }}
          NPM_EXPECTED_OWNER: ${{ vars.NPM_EXPECTED_OWNER }}
        run: |
          if [ "$NPM_BOOTSTRAP" = true ]; then
            python3 scripts/publish_npm.py bundle --require-published
          else
            python3 scripts/publish_npm.py bundle
          fi
