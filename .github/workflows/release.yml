# Artifact staging only. publish.yml uploads a passing run's bundle, byte for byte.
name: stage package release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Require release tag on merged main
        run: python scripts/check_release_ref.py --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE"

  binary-and-wheel:
    needs: source-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            platform_tag: macosx_11_0_arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform_tag: macosx_10_15_x86_64
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            platform_tag: manylinux_2_39_x86_64
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            platform_tag: manylinux_2_39_aarch64
          - target: win32-x64
            runner: windows-2022
            platform_tag: win_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Build pinned CLI and reject embedded private paths
        run: python scripts/build_release_cli.py --target ${{ matrix.target }}
      - name: Stage matching Python wheel
        run: python scripts/stage_release.py wheel --binary-root .release-tmp/binaries --targets ${{ matrix.target }}
      - run: python -m pip install build==1.3.0 hatchling==1.28.0
      - name: Build platform wheel
        working-directory: sdk/python
        env:
          JEVSCRIPT_TARGET: ${{ matrix.target }}
          JEVSCRIPT_PLATFORM_TAG: ${{ matrix.platform_tag }}
          JEVSCRIPT_WHEEL_TAG: py3-none-${{ matrix.platform_tag }}
        run: python -m build --wheel --no-isolation --outdir ../../.release-tmp/wheelhouse
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: |
            .release-tmp/binaries/${{ matrix.target }}
            .release-tmp/wheelhouse/*.whl

  npm-bundle:
    needs: binary-and-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: package-*
          path: .release-tmp
          merge-multiple: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - name: Stage every release binary in the npm package
        run: python3 scripts/stage_release.py npm --binary-root .release-tmp/binaries --targets darwin-arm64,darwin-x64,linux-arm64-gnu,linux-x64-gnu,win32-x64
      - name: Build complete npm artifact
        working-directory: sdk/js
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination ../../.release-tmp
      - name: Record and verify the exact bundle digests
        working-directory: .release-tmp
        run: |
          sha256sum jevscript-0.1.1.tgz wheelhouse/*.whl > SHA256SUMS
          mkdir ../.release-bundle
          cp -R SHA256SUMS jevscript-0.1.1.tgz wheelhouse ../.release-bundle/
          python3 ../scripts/verify_release_bundle.py ../.release-bundle --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: package-bundle
          path: .release-bundle/

  install-smoke:
    needs: npm-bundle
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
        platform: [darwin-arm64, darwin-x64, linux-x64-gnu, linux-arm64-gnu, win32-x64]
        include:
          - platform: darwin-arm64
            runner: macos-15
            wheel: macosx_11_0_arm64
          - platform: darwin-x64
            runner: macos-15-intel
            wheel: macosx_10_15_x86_64
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
            wheel: manylinux_2_39_x86_64
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            wheel: manylinux_2_39_aarch64
          - platform: win32-x64
            runner: windows-2022
            wheel: win_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: package-bundle
          path: .release-tmp
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install both built packages offline and run their real CLI and SDK
        run: python scripts/smoke_packages.py --npm .release-tmp/jevscript-0.1.1.tgz --wheel .release-tmp/wheelhouse/jevscript-0.1.1-py3-none-${{ matrix.wheel }}.whl
